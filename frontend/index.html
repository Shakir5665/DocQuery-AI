<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocQuery - Intelligent Document Assistant</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Tailwind CDN for exact Stitch compatibility -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#004ac6",
              "primary-container": "#2563eb",
              "on-primary": "#ffffff",
              "background": "#faf8ff",
              "surface": "#faf8ff",
              "surface-bright": "#faf8ff",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f2f3ff",
              "surface-container": "#eaedff",
              "surface-container-high": "#e2e7ff",
              "outline": "#737686",
              "outline-variant": "#c3c6d7",
              "secondary": "#006c4a",
              "secondary-container": "#82f5c1",
              "tertiary": "#824500",
              "on-surface": "#131b2e",
              "on-surface-variant": "#434655"
            },
            fontFamily: {
              sans: ["Inter", "-apple-system", "sans-serif"],
              headline: ["Plus Jakarta Sans", "sans-serif"]
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-background text-on-surface antialiased overflow-hidden selection:bg-primary-container selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
