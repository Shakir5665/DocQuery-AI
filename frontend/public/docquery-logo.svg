<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004ac6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#091e42" />
    </linearGradient>

    <!-- Document Subtle Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Accent Gradient for Spark & Lens -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Holographic Fold Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Document -->
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Base / Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#bgGrad)" />
  <rect x="16.5" y="16.5" width="223" height="223" rx="53.5" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.28" />

  <!-- Background Decorative Ambient Glow -->
  <circle cx="168" cy="88" r="64" fill="#38bdf8" opacity="0.22" filter="url(#aiGlow)" />

  <!-- Document Body with Shadow -->
  <g filter="url(#docShadow)">
    <!-- Base Paper Sheet with Cut/Folded Corner -->
    <path d="M 76 60
             H 142
             L 180 98
             V 194
             C 180 200.6 174.6 206 168 206
             H 76
             C 69.4 206 64 200.6 64 194
             V 72
             C 64 65.4 69.4 60 76 60 Z"
          fill="url(#docGrad)" />

    <!-- Folded Corner Flap -->
    <path d="M 142 60
             V 92
             C 142 95.3 144.7 98 148 98
             H 180
             Z"
          fill="url(#foldGrad)" />
  </g>

  <!-- Document Line Text Placers (Minimalist Data Representation) -->
  <rect x="84" y="120" width="48" height="7" rx="3.5" fill="#94a3b8" opacity="0.65" />
  <rect x="84" y="138" width="76" height="7" rx="3.5" fill="#cbd5e1" opacity="0.7" />
  <rect x="84" y="156" width="62" height="7" rx="3.5" fill="#cbd5e1" opacity="0.7" />
  <rect x="84" y="174" width="40" height="7" rx="3.5" fill="#93c5fd" opacity="0.85" />

  <!-- AI Intelligence Core: Sparkle / Query Diamond -->
  <g filter="url(#aiGlow)">
    <!-- Main 4-point AI Diamond Star -->
    <path d="M 174 130
             C 174 144 160 148 160 148
             C 160 148 174 152 174 166
             C 174 152 188 148 188 148
             C 188 148 174 144 174 130 Z"
          fill="url(#sparkGrad)" />

    <!-- Floating Micro AI Sparkle -->
    <path d="M 194 116
             C 194 121 189 122.5 189 122.5
             C 189 122.5 194 124 194 129
             C 194 124 199 122.5 199 122.5
             C 199 122.5 194 121 194 116 Z"
          fill="#a5f3fc" />
  </g>
</svg>
